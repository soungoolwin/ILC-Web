name: ilc-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_KEY: "base64:bq+6HEE85mq5bcDojIazNPgu1V9NPCLskFSbDz7Gq6E="
      APP_DEBUG: true
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
    ports:
      - "${APP_PORT:-8000}:8000"
    command: >
      sh -c "git config --global --add safe.directory /app &&
             composer install &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npx vite --config vite.docker.config.js"

volumes:
  composer_vendor:
  node_modules:
