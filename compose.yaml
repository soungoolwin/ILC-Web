name: ilc-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_KEY: "base64:bq+6HEE85mq5bcDojIazNPgu1V9NPCLskFSbDz7Gq6E="
      APP_DEBUG: true
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
    ports:
      - "${APP_PORT:-8000}:8000"
    command: >
      sh -c "git config --global --add safe.directory /app &&
             composer install &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:22-alpine
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm ci &&
             node --input-type=module -e 'import(\"vite\").then(async v => { const s = await v.createServer({ server: { host: \"0.0.0.0\", port: 5173, hmr: { host: \"localhost\" }, watch: { usePolling: true } } }); await s.listen(); s.printUrls(); });'"

volumes:
  composer_vendor:
  node_modules:
